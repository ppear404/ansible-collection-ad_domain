---
#Create domain admins

- name: Create domain admins in default ou
  microsoft.ad.user:
    name: "{{ item.user_name }}"
    sam_account_name: "{{ item.user_name }}"
    upn: "{{ item.user_name }}@{{ ad_domain }}"
    password: "{{ item.user_pwd }}"
    state: present
    enabled: true
    path: "{{ priv_users_ou }}"
    groups:
      add:
        - Domain Admins
  loop: "{{ domain_admins }}"
  no_log: true
